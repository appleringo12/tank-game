<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>戦車バトル</title>
<style>
  /* ============================================================
     基本レイアウト
     ・画面全体を「縦」に2分割する
       上：ゲーム画面（キャンバス）
       下：操作エリア（左＝移動スティック／右＝照準・発射・ミサイル）
     ============================================================ */
  :root{
    --bg-deep:#ffd9ec;
    --bg-mid:#e3d9ff;
    --olive:#ffb3d9;
    --olive-dark:#ff8fc4;
    --brick:#ffcf9e;
    --brick-dark:#ffb877;
    --steel:#c9baf5;
    --steel-dark:#a898e0;
    --amber:#ffcf6b;
    --paper:#7a5c8a;
    --blood:#ff6f91;
    --missile:#ff6f91;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:linear-gradient(160deg,#ffe3f3 0%,#f0e0ff 45%,#dcebff 100%);
    overflow:hidden;
    font-family:'Hiragino Maru Gothic ProN','Rounded Mplus 1c','Yu Gothic','Comic Sans MS',sans-serif;
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
  }

  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }

  /* ---- 上段：ゲーム画面 ---- */
  #gameArea{
    position:relative;
    flex:0 0 58%;         /* ★画面上部の割合。数値を変えると縦の比率が変わる */
    min-height:0;
    background:#fff0f8;
    display:flex; align-items:center; justify-content:center;
    border-bottom:4px solid #ffd1ea;
  }
  canvas{ display:block; touch-action:none; background:#ffeef7; border-radius:14px; }

  /* ---- 下段：操作エリア ---- */
  #controls{
    flex:1 1 auto;
    display:flex;
    background:#fff6fb;
  }
  .zone{
    flex:1 1 50%;
    position:relative;
    display:flex; align-items:flex-start; justify-content:center;
    border-top:1px solid rgba(255,150,205,0.18);
  }
  #leftZone{ border-right:2px dashed rgba(255,150,205,0.35); }
  .zone-label{
    margin-top:8px;
    color:rgba(150,105,170,0.65);
    font-size:11px;
    letter-spacing:1px;
    pointer-events:none;
    text-align:center;
    line-height:1.6;
  }

  /* ---- バーチャルスティック（見た目のみ。判定はJS側の数値で行う） ---- */
  .joy-base{
    position:absolute;
    width:104px; height:104px;
    border-radius:50%;
    border:2px solid rgba(201,186,245,0.9);
    background:rgba(201,186,245,0.35);
    pointer-events:none;
    z-index:4;
    box-shadow:0 2px 10px rgba(210,150,230,0.25);
  }
  .joy-stick{
    position:absolute;
    width:46px; height:46px;
    border-radius:50%;
    background:rgba(201,186,245,0.9);
    border:3px solid rgba(255,255,255,0.9);
    pointer-events:none;
    z-index:4;
    box-shadow:0 2px 6px rgba(210,150,230,0.4);
    transition:background 0.15s, transform 0.1s;
  }
  .joy-stick.fire-ready{ background:rgba(178,235,181,0.9); } /* 発射できる強さになったらミントグリーンに */
  .joy-stick.missile-charging{ background:rgba(255,138,178,0.9); } /* ミサイルを発射しようとしている間はコーラルピンクに */

  /* ---- HUD（ゲーム画面の上に重ねる文字類） ---- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px;
    color:var(--paper);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    pointer-events:none;
    text-shadow:1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    z-index:5;
  }
  #hud .grp{ display:flex; align-items:center; gap:8px; }
  #lives{ display:flex; align-items:center; gap:3px; }
  .heart{ width:14px; height:12px; }
  .livesCount{ font-size:12px; color:var(--paper); margin-left:2px; }
  #pauseBtn{
    pointer-events:auto;
    width:32px; height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.75);
    border:2px solid rgba(255,150,205,0.7);
    color:var(--paper);
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(210,150,230,0.35);
  }

  #stageFlash{
    position:absolute; top:40%; left:0; right:0;
    text-align:center;
    font-size:clamp(18px,6vw,30px);
    letter-spacing:5px;
    color:var(--amber);
    text-shadow:2px 2px 0 var(--brick-dark);
    opacity:0;
    pointer-events:none;
    z-index:6;
  }

  #stageClearScreen{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,240,250,0.94); color:var(--paper); text-align:center; padding:20px; gap:12px; z-index:25;
    cursor:pointer; touch-action:manipulation;
  }
  #stageClearScreen .clearTitle{font-size:clamp(24px,7vw,38px); letter-spacing:4px; color:#ff9ecb; font-weight:700; text-shadow:3px 3px 0 var(--brick-dark);}
  #stageClearScreen .clearStats{font-size:clamp(14px,4vw,18px); line-height:1.9;}
  #stageClearScreen .nextInfo{font-size:clamp(12px,3.5vw,16px); line-height:1.8; color:#8a6f97; max-width:390px;}
  #stageClearScreen .enemyLabel{display:block; margin-top:3px; color:#a98bb0;}
  #stageClearScreen .enemyIcons{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 14px; margin-top:7px;}
  #stageClearScreen .enemyIconWrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:58px;}
  #stageClearScreen .enemyTankIcon{width:clamp(52px,15vw,72px); height:auto; image-rendering:auto; filter:drop-shadow(2px 2px 0 rgba(210,150,230,.35));}
  #stageClearScreen .enemyCount{font-size:clamp(13px,3.5vw,16px); color:#ff9ecb; font-weight:700; margin-top:-2px;}
  #stageClearScreen .tapHint{margin-top:6px; font-size:12px; color:#a98bb0; letter-spacing:1px; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---- オーバーレイ画面（スタート／ポーズ／ゲームオーバー） ---- */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,240,250,0.94);
    color:var(--paper);
    text-align:center;
    padding:20px;
    gap:14px;
    z-index:20;
  }
  .hidden{ display:none !important; }
  .title{
    font-size:clamp(26px,8vw,44px);
    letter-spacing:5px;
    color:#ff9ecb;
    text-shadow:3px 3px 0 var(--brick-dark), 0 0 22px rgba(255,209,102,0.45);
    font-weight:700;
    margin:0;
  }
  .subtitle{
    font-size:clamp(11px,3.2vw,14px);
    color:#8a6f97;
    letter-spacing:1px;
    line-height:1.9;
    max-width:340px;
  }
  .subtitle b{ color:#ff8fc4; }
  .btn{
    font-family:inherit;
    font-size:clamp(15px,4.2vw,19px);
    letter-spacing:3px;
    padding:12px 38px;
    border-radius:24px;
    background:var(--olive);
    color:#fff;
    border:3px solid var(--olive-dark);
    border-bottom:6px solid var(--olive-dark);
    cursor:pointer;
    box-shadow:0 0 0 2px rgba(255,255,255,0.5);
  }
  .btn:active{ border-bottom-width:3px; transform:translateY(3px); }
  .btn.alt{ background:var(--brick); border-color:var(--brick-dark); border-bottom-color:var(--brick-dark); }
  .tank-emblem{ width:64px; height:64px; filter:drop-shadow(0 2px 4px rgba(210,150,230,.4)); }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 上段：ゲーム画面 ============ -->
  <div id="gameArea">
    <canvas id="game"></canvas>
    <!-- Flowerbed Fields [Loop] / CC0 -->
    <audio id="bgm" src="flowerbed_fields.ogg" loop preload="auto"></audio>

    <div id="hud" class="hidden">
      <div class="grp"><span id="stageLabel">STAGE 1</span></div>
      <div class="grp"><span id="lives"></span></div>
      <div class="grp"><span id="maxStageLabel">MAX STAGE 1</span></div>
      <button id="pauseBtn">II</button>
    </div>
    <div id="stageFlash"></div>

    <!-- スタート画面 -->
    <div id="startScreen" class="overlay">
      <svg class="tank-emblem" viewBox="0 0 64 64">
        <rect x="14" y="26" width="36" height="18" rx="6" fill="#ffb3d9" stroke="#fff" stroke-width="1.5"/>
        <rect x="10" y="40" width="44" height="6" rx="3" fill="#ff8fc4"/>
        <circle cx="18" cy="46" r="5" fill="#c9baf5" stroke="#fff" stroke-width="1.2"/>
        <circle cx="32" cy="46" r="5" fill="#c9baf5" stroke="#fff" stroke-width="1.2"/>
        <circle cx="46" cy="46" r="5" fill="#c9baf5" stroke="#fff" stroke-width="1.2"/>
        <rect x="30" y="10" width="7" height="20" rx="3" fill="#ffd166"/>
        <circle cx="30" cy="30" r="10" fill="#ffb3d9" stroke="#fff" stroke-width="1.5"/>
      </svg>
      <h1 class="title">戦車バトル</h1>
      <p class="subtitle">
        画面下・左側ドラッグ＝<b>移動</b><br>
        画面下・右側ドラッグ＝<b>照準</b>、そのまま<b>タップ</b>で発射<br>
        右下側を<b>長押し</b>＝<b>ミサイル発射</b>（約2秒後に着弾）<br>
        弾は壁に1回だけ跳ね返る
      </p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <!-- ステージクリア画面 -->
    <div id="stageClearScreen" class="hidden">
      <div class="clearTitle" id="clearStageTitle">STAGE 1 CLEAR!</div>
      <div class="clearStats" id="clearStats"></div>
      <div class="nextInfo" id="nextStageInfo"></div>
      <div class="tapHint">画面をタップすると次のステージへ</div>
    </div>

    <!-- ポーズ画面 -->
    <div id="pauseScreen" class="overlay hidden">
      <h1 class="title" style="font-size:clamp(22px,6vw,32px);">一時停止</h1>
      <button class="btn" id="resumeBtn">再開する</button>
      <button class="btn alt" id="restartFromPauseBtn">最初からやり直す</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="title" style="color:var(--blood); text-shadow:3px 3px 0 #ffc9dc;">GAME OVER</h1>
      <p class="subtitle">到達ステージ: <b id="finalStage"></b><br>最大到達ステージ: <b id="finalMaxStage"></b><br>スコア: <b id="finalScore"></b></p>
      <button class="btn" id="retryBtn">もう一度</button>
    </div>
  </div>

  <!-- ============ 下段：操作エリア ============ -->
  <div id="controls">
    <div id="leftZone" class="zone">
      <div class="zone-label">左側ドラッグ<br>＝移動</div>
    </div>
    <div id="rightZone" class="zone">
      <div class="zone-label">右側ドラッグ＝照準、ドラッグ中に2本目の指でタップ＝発射<br>右下側を長押し＝ミサイル発射</div>
    </div>
  </div>

</div>

<script>
(() => {
"use strict";

/* ================================================================
   ★★★ ここから「パラメータ設定エリア」★★★
   ゲームバランスをいじりたいときは、まずこのあたりの数値を
   変更してみてください。単位はだいたい「ワールド座標(px相当)/秒」です。
   ================================================================ */

const WORLD_H = 320;   // 8マス。16:9画面でも全体を見渡せるサイズ

const COLS = WORLD_W / TILE; // 横方向のマス数
const ROWS = WORLD_H / TILE; // 縦方向のマス数

// --- 戦車のパラメータ ---
const TANK_R = 15;          // 戦車本体の当たり判定の半径
const CAMERA_ZOOM = 1.0;       // マップ全体を常時表示
const PLAYER_SPEED = 50;    // 標準移動速度
const PLAYER_MAX_BULLETS = 5; // ★自機が画面上に同時に出せる弾の最大数
const PLAYER_FIRE_INTERVAL = 0.3; // ★自機の射撃間隔（秒）

// --- 弾のパラメータ ---
// 自機は画面上の最大弾数に加えて、0.2秒の射撃間隔制限を設ける。
const BULLET_R = 4;         // 弾の半径（当たり判定）
const BULLET_SPEED = 80;
const BULLET_MAX_BOUNCE = 1;// 弾が壁で跳ね返れる回数（0にすると跳ね返らない）
const ENEMY_FIRE_INTERVAL = 2.4; // ★通常の敵戦車の最低発射間隔（秒）
const BULLET_SELF_SAFE_TIME = 3.0; // ★自機の弾が発射から何秒間は自分に当たらないか（壁際での自滅防止）
const ENEMY_DODGE_RADIUS = 55; // ★この距離まで自分以外の弾が近づくと、敵は弾と逆方向へ少し逃げる

// --- ミサイルのパラメータ ---
const MISSILE_HOLD_TIME = 0.5;       // ★長押しと判定するまでの時間(秒)
const MISSILE_MOVE_DEADZONE = 14;    // これ以上指が動いたら長押しをキャンセル(px)

  yellow:{ speed:0,  hp:1, color:"#ffe999", dark:"#f0c95c", maxBullets:1, bulletSpeed:80,  score:100, r:TANK_R, fastBullet:false, fireInterval:10.0, dodge:false },

   ステージ（マップ）のデータ
   ・文字の意味
     "." = 何もない床

const keys = {}; // キーボード操作（PCでの動作確認用）

  aimAngle:0, aiming:false, aimMag:0, // 右スティックの入力状態（角度と強さ）
  fireRequested:false,               // 照準ドラッグ中の2本目のタップでtrueになる
};

const MAX_JOY = 46; // スティックが動ける最大半径(px)。見た目の joy-base の半径と合わせる

// 左スティック（移動用）の状態
const leftJoy  = { active:false, id:null, sx:0, sy:0 };
// 右スティック（照準・発射・ミサイル用）の状態
const rightJoy = { active:false, id:null, sx:0, sy:0, holdTime:0, dragged:false, missileArmed:false };

const leftZoneEl  = document.getElementById("leftZone");
const rightZoneEl = document.getElementById("rightZone");

function mkEl(cls){
  const d=document.createElement("div");
  d.className=cls+" hidden";
  document.getElementById("app").appendChild(d);
  return d;
}
const leftBase = mkEl("joy-base"), leftStick = mkEl("joy-stick");
const rightBase = mkEl("joy-base"), rightStick = mkEl("joy-stick");

function placeJoy(baseEl, stickEl, sx, sy, dx, dy){
  baseEl.style.left = (sx-52)+"px"; baseEl.style.top = (sy-52)+"px";
  stickEl.style.left = (sx+dx-23)+"px"; stickEl.style.top = (sy+dy-23)+"px";
}

// ---- 左ゾーン（移動） ----
function leftStart(x,y,id){
  if(leftJoy.active) return;
  leftJoy.active=true; leftJoy.id=id; leftJoy.sx=x; leftJoy.sy=y;
  leftBase.classList.remove("hidden"); leftStick.classList.remove("hidden");
  placeJoy(leftBase, leftStick, x, y, 0, 0);
}
function leftMove(x,y,id){
  if(!leftJoy.active || id!==leftJoy.id) return;
  let dx=x-leftJoy.sx, dy=y-leftJoy.sy;
  const d=Math.hypot(dx,dy);
  if(d>MAX_JOY){ dx=dx/d*MAX_JOY; dy=dy/d*MAX_JOY; }
  placeJoy(leftBase, leftStick, leftJoy.sx, leftJoy.sy, dx, dy);
  const mag = Math.min(d,MAX_JOY)/MAX_JOY;
  if(mag>0.15){ input.moveX=dx/(d||1); input.moveY=dy/(d||1); input.moving=true; }
  else { input.moving=false; }
}
function leftEnd(id){
  if(!leftJoy.active || id!==leftJoy.id) return;
  leftJoy.active=false; input.moving=false;
  leftBase.classList.add("hidden"); leftStick.classList.add("hidden");
}

// ---- 右ゾーン（照準／発射／ミサイル） ----
function rightStart(x,y,id){
  // 右側の指は照準専用。発射は画面全体のタップを受け付ける。
  if(rightJoy.active) return;
  rightJoy.active=true; rightJoy.id=id; rightJoy.sx=x; rightJoy.sy=y;
  rightJoy.holdTime=0; rightJoy.dragged=false; rightJoy.missileArmed=false;
  rightBase.classList.remove("hidden"); rightStick.classList.remove("hidden");
  placeJoy(rightBase, rightStick, x, y, 0, 0);
  input.aiming = true;
}
function rightMove(x,y,id){
  if(!rightJoy.active || id!==rightJoy.id) return;
  let dx=x-rightJoy.sx, dy=y-rightJoy.sy;
  const d=Math.hypot(dx,dy);
  if(d > MISSILE_MOVE_DEADZONE) rightJoy.dragged = true; // 一定以上動いたら「ミサイル長押し」は取り消し
  if(d>MAX_JOY){ dx=dx/d*MAX_JOY; dy=dy/d*MAX_JOY; }
  placeJoy(rightBase, rightStick, rightJoy.sx, rightJoy.sy, dx, dy);
  input.aimMag = Math.min(d,MAX_JOY)/MAX_JOY;
  if(input.aimMag>0.2){ input.aimAngle = Math.atan2(dy,dx); }
  rightStick.classList.toggle("fire-ready", input.aimMag>0.55 && rightJoy.dragged);
}
function rightEnd(id){
  if(!rightJoy.active || id!==rightJoy.id) return;
  // 照準ドラッグを離しただけでは発射しない。
  // 発射は「ドラッグを維持したまま2本目の指でタップ」で行う。
  rightJoy.active=false; input.aimMag=0; input.aiming=false;
  rightBase.classList.add("hidden"); rightStick.classList.add("hidden");
  rightStick.classList.remove("missile-charging","fire-ready");
}

function bindZone(el, onStart, onMove, onEnd){
  el.addEventListener("touchstart", e=>{
    e.preventDefault();
    for(const t of e.changedTouches) onStart(t.clientX, t.clientY, t.identifier);
  }, {passive:false});
  el.addEventListener("touchmove", e=>{
    e.preventDefault();
    for(const t of e.changedTouches) onMove(t.clientX, t.clientY, t.identifier);
  }, {passive:false});
  el.addEventListener("touchend", e=>{
    e.preventDefault();
    for(const t of e.changedTouches) onEnd(t.identifier);
  }, {passive:false});
  el.addEventListener("touchcancel", e=>{
    for(const t of e.changedTouches) onEnd(t.identifier);
  });
  // マウス操作（PC確認用のフォールバック）
  let down=false;
  el.addEventListener("mousedown", e=>{ down=true; onStart(e.clientX,e.clientY,"mouse"); });
  window.addEventListener("mousemove", e=>{ if(down) onMove(e.clientX,e.clientY,"mouse"); });
  window.addEventListener("mouseup", e=>{ if(down){ onEnd("mouse"); down=false; } });
}
// ---- 画面全体タップで発射 ----
// 右側で照準をドラッグしている指を除き、どこをタップしても発射する。
// ただし移動ボタン（左ゾーン）の位置をタップした場合は発射しない。
window.addEventListener("touchstart", e=>{
  // ミサイル発射後も、照準用の指を離さずに2本目の指でそのまま通常弾を発射できる。
  if(!rightJoy.active || !rightJoy.dragged || input.aimMag<=0.35) return;
  // ★座標で判定する（移動スティックの見た目は#app直下にあり、leftZoneElのDOM子要素では
  //   ないため、要素のcontains判定ではなく座標の矩形判定で正しく除外する）
  const leftRect = leftZoneEl.getBoundingClientRect();
  for(const t of e.changedTouches){
    if(t.identifier === rightJoy.id) continue;
    if(t.clientX>=leftRect.left && t.clientX<=leftRect.right && t.clientY>=leftRect.top && t.clientY<=leftRect.bottom) continue;
    input.fireRequested = true;
    break;
  }
}, {passive:true, capture:true});

bindZone(leftZoneEl, leftStart, leftMove, leftEnd);
bindZone(rightZoneEl, rightStart, rightMove, rightEnd);

/* ================================================================
   数学・当たり判定まわりの小さなヘルパー関数
   ================================================================ */
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(a,b){ return a+Math.random()*(b-a); }
// 角度を滑らかに補間する（t=0〜1、1に近いほど一気に回転する）
function lerpAngle(a,b,t){
  let diff = ((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;
  return a+diff*t;
}
// 円と四角形が重なっているか判定
function circleRectOverlap(cx,cy,r,rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw), ny = clamp(cy, ry, ry+rh);
  const dx=cx-nx, dy=cy-ny;
  return (dx*dx+dy*dy) < r*r;
}

let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
const SFX_VOLUME_MULTIPLIER = 1.25; // 効果音を全体的に約1.25倍
function playTone(freq, duration, type="square", volume=0.035, slide=0){
  if(!audioCtx) return;
  const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,now);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),now+duration);
  g.gain.setValueAtTime(volume*3*SFX_VOLUME_MULTIPLIER,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+duration);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+duration+0.02);
}

// マップ文字列から壁・スポーン地点を作る
function buildLevel(idx){
  const lvl = LEVELS[idx % LEVELS.length];
  walls = []; bricksHp = [];
  for(let r=0;r<ROWS;r++){
    walls.push([]); bricksHp.push([]);
    for(let c=0;c<COLS;c++){
      const ch = lvl.map[r][c];
      let v = EMPTY;
      if(ch==="#") v=BRICK;
      else if(ch==="X") v=STEEL;
      walls[r].push(v);
      bricksHp[r].push(v===BRICK?2:0); // ★レンガの硬さ。2=弾2発で破壊。1にすると1発で壊れるようになる
    }
  }
  tanks=[]; bullets=[]; missiles=[]; particles=[]; explosions=[];

  let playerSpawn = {x:WORLD_W/2, y:WORLD_H/2};
  const enemySpawns = [];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const ch = lvl.map[r][c];
      const wx = c*TILE+TILE/2, wy = r*TILE+TILE/2;
      if(ch==="P") playerSpawn = {x:wx,y:wy};
      else if(/[1-5]/.test(ch)) enemySpawns.push({x:wx,y:wy, order:parseInt(ch,10)});
    }
  }
  enemySpawns.sort((a,b)=>a.order-b.order);

  player = makePlayer(playerSpawn.x, playerSpawn.y);
  tanks.push(player);

  const comp = lvl.enemies;
  for(let i=0;i<comp.length;i++){
    const sp = enemySpawns[i % Math.max(enemySpawns.length,1)] || playerSpawn;
    tanks.push(makeEnemy(comp[i], sp.x, sp.y));
  }
}

function makePlayer(x,y){
  return {
    isPlayer:true, x, y, angle:-Math.PI/2, turretAngle:-Math.PI/2,
    r:TANK_R, speed:PLAYER_SPEED, hp:1, alive:true,
    maxBullets:PLAYER_MAX_BULLETS, // 画面上に同時に出せる自分の弾の最大数
    fireCooldown:0, // 次の射撃までの待ち時間
    fireBuffered:false, // ★発射間隔制限中に押された入力を覚えておく（先行入力）
    invuln:2.0,  // ★復活直後の無敵時間(秒)
    blink:0,
    color:"#8ecbff", dark:"#5fa8e8",
  };
}
function makeEnemy(type,x,y){
  const t = ENEMY_TYPES[type];
  return {
    isPlayer:false, type, x, y, angle:Math.random()*Math.PI*2, turretAngle:0,
    r:t.r, speed:t.speed, hp:t.hp, maxHp:t.hp, alive:true,
    spawnX:x, spawnY:y, // 復活時にこの位置へ戻す
    maxBullets:t.maxBullets, // 画面上に同時に出せる自分の弾の最大数
    fireCooldown: rand(0, t.fireInterval ?? ENEMY_FIRE_INTERVAL), // 敵ごとに少しずつ発射タイミングをずらす
    color:t.color, dark:t.dark,
    dodge: t.dodge !== false, // ★弾を避けるかどうか（黄色・茶色はfalseで避けない）
    wanderTimer: rand(0.5,1.5), wanderDir: Math.random()*Math.PI*2,

// 指定した戦車が今、画面上に出している自分の弾の数を数える
function countBullets(owner){

  return n;
}

/* ================================================================
   壁・戦車どうしの当たり判定
   ================================================================ */
function resolveWallCollision(tank){
  const minC = Math.max(0, Math.floor((tank.x-tank.r)/TILE)-1);
  const maxC = Math.min(COLS-1, Math.floor((tank.x+tank.r)/TILE)+1);
  const minR = Math.max(0, Math.floor((tank.y-tank.r)/TILE)-1);
  const maxR = Math.min(ROWS-1, Math.floor((tank.y+tank.r)/TILE)+1);
  for(let r=minR;r<=maxR;r++){
    for(let c=minC;c<=maxC;c++){
      if(walls[r][c]===EMPTY) continue;
      const rx=c*TILE, ry=r*TILE;
      if(circleRectOverlap(tank.x,tank.y,tank.r, rx,ry,TILE,TILE)){
        const cx = clamp(tank.x, rx, rx+TILE), cy = clamp(tank.y, ry, ry+TILE);
        let dx = tank.x-cx, dy = tank.y-cy;
        let d = Math.hypot(dx,dy);
        if(d<0.001){ dx=tank.x-(rx+TILE/2); dy=tank.y-(ry+TILE/2); d=Math.hypot(dx,dy)||1; }
        const push = tank.r-d;
        tank.x += dx/d*push;
        tank.y += dy/d*push;
      }
    }
  }
  tank.x = clamp(tank.x, tank.r, WORLD_W-tank.r);
  tank.y = clamp(tank.y, tank.r, WORLD_H-tank.r);
}
function tanksOverlap(a,b){
  const dx=a.x-b.x, dy=a.y-b.y;
  const d=Math.hypot(dx,dy), minD=a.r+b.r;
  if(d<minD && d>0.001){
    const push=(minD-d)/2;
    a.x+=dx/d*push; a.y+=dy/d*push;
    b.x-=dx/d*push; b.y-=dy/d*push;
  }
}
// 敵AIの視界チェック（間に壁があれば見えない）
function hasLineOfSight(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0;
  const dist=Math.hypot(dx,dy);
  const steps=Math.ceil(dist/12);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const x=x0+dx*t, y=y0+dy*t;
    const c=Math.floor(x/TILE), r=Math.floor(y/TILE);
    if(r<0||c<0||r>=ROWS||c>=COLS) return false;
    if(walls[r][c]!==EMPTY) return false;
  }
  return true;
}

/* ================================================================
   弾
   ================================================================ */
function spawnBullet(owner){
  const enemyType = !owner.isPlayer ? ENEMY_TYPES[owner.type] : null;
  const fastBullet = !!enemyType?.fastBullet;
  const speed = enemyType?.bulletSpeed ?? BULLET_SPEED;
  bullets.push({
    x: owner.x + Math.cos(owner.turretAngle)*(owner.r+6),
    y: owner.y + Math.sin(owner.turretAngle)*(owner.r+6),
    vx: Math.cos(owner.turretAngle)*speed,
    vy: Math.sin(owner.turretAngle)*speed,
    owner, bounces:0, dead:false, trail:[], fastBullet, age:0,
  });
  playShot(fastBullet);
}
function updateBullets(dt){
  for(const b of bullets){
    if(b.dead) continue;
    b.age += dt;
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>5) b.trail.shift();
    b.x += b.vx*dt; b.y += b.vy*dt;

    // 高速弾は反射しない。外周・壁に当たったら専用エフェクトを出して消える。
    if(b.fastBullet){
      if(b.x<BULLET_R || b.x>WORLD_W-BULLET_R || b.y<BULLET_R || b.y>WORLD_H-BULLET_R){
        spawnFastBulletImpactFx(clamp(b.x,BULLET_R,WORLD_W-BULLET_R), clamp(b.y,BULLET_R,WORLD_H-BULLET_R));
        b.dead=true; continue;
      }
    } else {
      // 通常弾は外周で1回まで跳ね返る
      if(b.x<BULLET_R){ b.x=BULLET_R; b.vx*=-1; b.bounces++; }
      if(b.x>WORLD_W-BULLET_R){ b.x=WORLD_W-BULLET_R; b.vx*=-1; b.bounces++; }
      if(b.y<BULLET_R){ b.y=BULLET_R; b.vy*=-1; b.bounces++; }
      if(b.y>WORLD_H-BULLET_R){ b.y=WORLD_H-BULLET_R; b.vy*=-1; b.bounces++; }
    }

    // 壁との当たり判定
    const col=Math.floor(b.x/TILE), row=Math.floor(b.y/TILE);
    if(row>=0&&col>=0&&row<ROWS&&col<COLS && walls[row][col]!==EMPTY){
      if(walls[row][col]===BRICK){
        // 木箱は弾では壊れず、通常弾だけ反射する。破壊はミサイルのみ。
        if(b.fastBullet){
          spawnFastBulletImpactFx(b.x,b.y);
          b.dead=true;
        } else if(b.bounces < BULLET_MAX_BOUNCE){
          const cxTile=col*TILE+TILE/2, cyTile=row*TILE+TILE/2;
          if(Math.abs(b.x-cxTile) > Math.abs(b.y-cyTile)) b.vx*=-1; else b.vy*=-1;
          b.bounces++;
          b.x += b.vx*dt*2;
          b.y += b.vy*dt*2;
        } else {
          spawnHitFx(b.x,b.y);
          b.dead=true;
        }
        continue;
      } else {
        if(b.fastBullet){
          spawnFastBulletImpactFx(b.x,b.y);
          b.dead=true;
          continue;
        }
        // 鉄壁：通常弾だけ跳ね返す
        if(b.bounces < BULLET_MAX_BOUNCE){
          const cxTile=col*TILE+TILE/2, cyTile=row*TILE+TILE/2;
          if(Math.abs(b.x-cxTile) > Math.abs(b.y-cyTile)) b.vx*=-1; else b.vy*=-1;
          b.bounces++;
          b.x += b.vx*dt*2;
          b.y += b.vy*dt*2;
        } else {
          spawnHitFx(b.x,b.y);
          b.dead=true;
          continue;
        }
      }
    }
    if(!b.fastBullet && b.bounces > BULLET_MAX_BOUNCE){ b.dead=true; continue; }

    // 戦車との当たり判定
    for(const t of tanks){
      if(!t.alive) continue;
      if(t===b.owner){
        // 敵は自分の弾には絶対に当たらない。
        if(!t.isPlayer) continue;
        // ★自機の弾は発射から一定時間は自分に当たらない（壁際で撃って自滅するのを防ぐ）
        if(b.age < BULLET_SELF_SAFE_TIME) continue;
      }
      if(t.isPlayer && t.invuln>0 && b.owner!==t) continue;
      const dx=b.x-t.x, dy=b.y-t.y;
      if(dx*dx+dy*dy < (t.r+BULLET_R)*(t.r+BULLET_R)){
        b.dead=true;
        damageTank(t);
        spawnHitFx(b.x,b.y);
        playHit();
        break;
      }
    }
  }

  // 弾どうしの当たり判定：ぶつかった弾は両方とも消滅する
  for(let i=0;i<bullets.length;i++){
    const b1 = bullets[i];
    if(b1.dead) continue;
    for(let j=i+1;j<bullets.length;j++){
      const b2 = bullets[j];
      if(b2.dead) continue;
      const dx=b1.x-b2.x, dy=b1.y-b2.y;
      if(dx*dx+dy*dy < (BULLET_R*2)*(BULLET_R*2)){
        b1.dead = true; b2.dead = true;
        spawnHitFx((b1.x+b2.x)/2, (b1.y+b2.y)/2);
        break;
      }
    }
  }

  bullets = bullets.filter(b=>!b.dead);
}

function damageTank(t){
  t.hp--;
  if(t.hp<=0){
    t.alive=false;
    spawnExplosion(t.x,t.y, t.isPlayer?1.4:1.0);
    playExplosion();
    if(t.isPlayer) onPlayerDeath();
    else {
      score += ENEMY_TYPES[t.type].score;
    }
  } else {
    spawnHitFx(t.x,t.y);
  }
}

function onPlayerDeath(){
  lives--;

  // 死亡時に、倒されずに残っている敵だけ初期位置へ戻す。
  // すでに倒した敵は tanks から除去済みなので復活しない。
  for(const t of tanks){
    if(t.isPlayer || !t.alive) continue;
    t.x = t.spawnX;
    t.y = t.spawnY;
    t.angle = Math.random()*Math.PI*2;
    t.turretAngle = 0;
    t.wanderTimer = rand(0.5,1.5);
    t.wanderDir = Math.random()*Math.PI*2;
    t.stuckTimer = 0;
    const type = ENEMY_TYPES[t.type];
    t.fireCooldown = rand(0, type.fireInterval ?? ENEMY_FIRE_INTERVAL);
  }

  // 画面上の弾をすべて消して、死亡前の弾の状態をリセットする。
  bullets = [];

  respawnTimer = 1.4; // ★死亡してから復活するまでの待ち時間(秒)
  state = "dying";
}

/* ================================================================
   ミサイル
   ・右側を長押しする操作をそのまま利用
   ・発射時点の「自機の車体の向き」を基準に5ブロック先を着弾地点にする
   ・発射から約2秒で着弾し、爆風で敵・自機・木箱に作用する
   ================================================================ */
function fireMissile(){
  if(missiles.length >= MISSILE_MAX_ACTIVE || !player || !player.alive) return false;
  const angle = player.angle; // ★砲塔ではなく車体の向き
  const startX = player.x + Math.cos(angle)*(player.r+5);
  const startY = player.y + Math.sin(angle)*(player.r+5);
  const targetX = clamp(player.x + Math.cos(angle)*MISSILE_DISTANCE, MISSILE_DISTANCE*0.02, WORLD_W-MISSILE_DISTANCE*0.02);
  const targetY = clamp(player.y + Math.sin(angle)*MISSILE_DISTANCE, MISSILE_DISTANCE*0.02, WORLD_H-MISSILE_DISTANCE*0.02);
  missiles.push({x:startX,y:startY,startX,startY,targetX,targetY,angle,time:0,dead:false});
  playMissileLaunch();
  return true;
}

function updateMissiles(dt){
  for(const m of missiles){
    if(m.dead) continue;
    m.time += dt;
    const p = clamp(m.time/MISSILE_FLIGHT_TIME,0,1);
    // 少し加速して着弾するように見せる
    const eased = p*p*(3-2*p);
    m.x = m.startX + (m.targetX-m.startX)*eased;
    m.y = m.startY + (m.targetY-m.startY)*eased;
    if(m.time >= MISSILE_FLIGHT_TIME){
      explodeMissile(m);
    }
  }
  missiles = missiles.filter(m=>!m.dead);
}

function explodeMissile(m){
  if(m.dead) return;
  m.dead = true;
  spawnExplosion(m.targetX,m.targetY,1.3);
  // ミサイルらしい着弾音（既存爆発音を少し高めに重ねる）
  playExplosion();
  playTone(260,0.18,"sine",0.045,140);

  const blastR = MISSILE_BLAST_RADIUS;
  const minCol = Math.max(0, Math.floor((m.targetX-blastR)/TILE));
  const maxCol = Math.min(COLS-1, Math.floor((m.targetX+blastR)/TILE));
  const minRow = Math.max(0, Math.floor((m.targetY-blastR)/TILE));
  const maxRow = Math.min(ROWS-1, Math.floor((m.targetY+blastR)/TILE));
  for(let r=minRow;r<=maxRow;r++) for(let c=minCol;c<=maxCol;c++){
    if(walls[r][c] !== BRICK) continue;
    const rx=c*TILE, ry=r*TILE;
    if(circleRectOverlap(m.targetX,m.targetY,blastR,rx,ry,TILE,TILE)){
      walls[r][c]=EMPTY; bricksHp[r][c]=0;
      spawnHitFx(rx+TILE/2,ry+TILE/2);
    }
  }
  for(const t of tanks){
    if(!t.alive) continue;
    if(t.isPlayer && t.invuln>0) continue;
    const dx=t.x-m.targetX, dy=t.y-m.targetY;
    if(dx*dx+dy*dy < blastR*blastR) damageTank(t);
  }
}

/* ================================================================
   エフェクト（爆発の破片など）
   ================================================================ */
function spawnExplosion(x,y,scaleF){
  explosions.push({x,y,t:0, dur:0.5, scaleF});
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=rand(40,180)*scaleF;
    particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.3,0.6), t:0,
      color: Math.random()>0.5 ? "#ffd166":"#ff8aa8"});
  }
}
function spawnHitFx(x,y){
  for(let i=0;i<5;i++){
    const a=Math.random()*Math.PI*2, sp=rand(30,90);
    particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.15,0.3), t:0, color:"#ffd9ec"});
  }
}
function spawnFastBulletImpactFx(x,y){
  // 高速弾専用：細い閃光＋淡いパステルブルーの火花
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, sp=rand(70,190);
    particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.12,0.28), t:0, color:i%2?"#b3ecff":"#ffffff"});
  }
  explosions.push({x,y,t:0,dur:0.16,scaleF:0.45, fast:true});
}
function updateFx(dt){
  for(const p of particles){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.9; p.vy*=0.9; }
  particles = particles.filter(p=>p.t<p.life);
  for(const e of explosions){ e.t+=dt; }
  explosions = explosions.filter(e=>e.t<e.dur);
}

/* ================================================================
   敵AI
   ・視界に入っていなければランダムにうろつく
   ・視界に入っていれば追いかけつつ、狙いが合ったら発砲する
   ================================================================ */
function updateEnemy(t, dt){
  if(!t.alive) return;
  const p = player;
  const canSeePlayer = p.alive && hasLineOfSight(t.x,t.y,p.x,p.y);

  t.wanderTimer -= dt;
  t.fireCooldown = Math.max(0, (t.fireCooldown ?? 0) - dt);
  if(t.wanderTimer<=0 || t.stuckTimer>0.4){
    // プレイヤーが見えていれば大まかにプレイヤー方向へ、見えていなければランダムな方向へ
    t.wanderDir = canSeePlayer ? Math.atan2(p.y-t.y, p.x-t.x) + rand(-0.35,0.35) : Math.random()*Math.PI*2;
    t.wanderTimer = rand(0.8,2.0); // ★次に方向転換を検討するまでの間隔
    t.stuckTimer = 0;
  }

  // ★自分以外の弾が一定距離まで近づいたら、その弾と逆方向へ少し逃げる（黄色・茶色は避けない）
  let dodgeDir = null, dodgeDistSq = ENEMY_DODGE_RADIUS*ENEMY_DODGE_RADIUS;
  if(t.dodge){
    for(const b of bullets){
      if(b.dead || b.owner===t) continue;
      const dx = t.x-b.x, dy = t.y-b.y;
      const distSq = dx*dx+dy*dy;
      if(distSq < dodgeDistSq){
        dodgeDistSq = distSq;
        dodgeDir = Math.atan2(dy,dx); // 弾から自分への向き＝逃げる方向
      }
    }
  }
  if(dodgeDir !== null){
    t.wanderDir = dodgeDir;
    t.wanderTimer = 0.35; // 少しの間だけ逃げたら、通常の行動に戻る
    t.stuckTimer = 0;
  }

  const prevX=t.x, prevY=t.y;
  t.angle = lerpAngle(t.angle, t.wanderDir, 1-Math.pow(0.001,dt)); // 数値を小さくすると曲がる速さが変わる
  t.x += Math.cos(t.angle)*t.speed*dt;
  t.y += Math.sin(t.angle)*t.speed*dt;
  resolveWallCollision(t);
  const moved = Math.hypot(t.x-prevX, t.y-prevY);
  if(moved < t.speed*dt*0.3) t.stuckTimer += dt; else t.stuckTimer = 0; // 壁にひっかかったら方向転換

  if(canSeePlayer){
    t.turretAngle = lerpAngle(t.turretAngle, Math.atan2(p.y-t.y,p.x-t.x), 1-Math.pow(0.0005,dt));
  }

  // 敵は一定間隔で発射できる。
  if(canSeePlayer && p.invuln<=0 && t.fireCooldown<=0 && countBullets(t) < t.maxBullets){
    const aimDiff = Math.abs(((Math.atan2(p.y-t.y,p.x-t.x)-t.turretAngle+Math.PI*3)%(Math.PI*2))-Math.PI);
    if(aimDiff < 0.28){ // ★この角度以内に狙いが合ったら撃つ（ラジアン）
      spawnBullet(t);
      t.fireCooldown = t.fireInterval ?? ENEMY_FIRE_INTERVAL;
    }
  }
}

/* ================================================================
   自機の更新
   ================================================================ */
function updatePlayer(dt){
  if(!player.alive) return;

  // ---- 移動（左スティック／WASD／矢印キー） ----
  let mx=0,my=0, moving=false;
  if(input.moving){ mx=input.moveX; my=input.moveY; moving=true; }
  if(keys["w"]||keys["arrowup"]){ my-=1; moving=true; }
  if(keys["s"]||keys["arrowdown"]){ my+=1; moving=true; }
  if(keys["a"]||keys["arrowleft"]){ mx-=1; moving=true; }
  if(keys["d"]||keys["arrowright"]){ mx+=1; moving=true; }
  if(moving){
    const len=Math.hypot(mx,my)||1;
    mx/=len; my/=len;
    const targetAngle = Math.atan2(my,mx);
    player.angle = lerpAngle(player.angle, targetAngle, 1-Math.pow(0.00005,dt));
    player.x += mx*player.speed*dt; // ★PLAYER_SPEEDを変えると移動速度が変わる
    player.y += my*player.speed*dt;
    resolveWallCollision(player);
  }

  // ---- 砲塔の向き（右スティックでドラッグ中はその方向、それ以外は徐々に車体方向へ） ----
  if(input.aiming && input.aimMag>0.2){
    player.turretAngle = input.aimAngle;
  } else if(!input.aiming){
    player.turretAngle = lerpAngle(player.turretAngle, player.angle, 1-Math.pow(0.02,dt));
  }

  if(player.invuln>0){ player.invuln-=dt; player.blink+=dt; }
  gameStartFireLock = Math.max(0, gameStartFireLock - dt);
  player.fireCooldown = Math.max(0, (player.fireCooldown ?? 0) - dt);

  // ---- 発射（照準ドラッグ中の2本目のタップ or スペースキー） ----
  // 画面上の弾数に加えて、射撃間隔制限を適用する。
  // ★先行入力：射撃間隔制限（クールダウン）中に発射ボタンが押されても、
  //   すぐには撃てないだけで入力自体は覚えておき、次に撃てる状態になった
  //   瞬間に自動的に発射する。ただし画面上の弾が上限（5発）に達している
  //   ときは、先行入力として記憶しない（＝5発目を撃った後は自動発射しない）。
  if((input.fireRequested || keys[" "]) && countBullets(player) < player.maxBullets){
    player.fireBuffered = true;
  }
  input.fireRequested = false;
  if(player.fireBuffered && gameStartFireLock<=0 && player.fireCooldown<=0 && countBullets(player) < player.maxBullets){
    spawnBullet(player);
    player.fireCooldown = PLAYER_FIRE_INTERVAL;
    player.fireBuffered = false;
  }

  // ---- ミサイルの長押し判定 ----
  // 右ゾーンを押していて、まだドラッグしていない間だけカウント。
  if(rightJoy.active && !rightJoy.dragged && !rightJoy.missileArmed){
    rightJoy.holdTime += dt;
    rightStick.classList.toggle("missile-charging", rightJoy.holdTime > MISSILE_HOLD_TIME*0.4);
    if(rightJoy.holdTime >= MISSILE_HOLD_TIME){
      if(fireMissile()){
        rightJoy.missileArmed = true;
        rightJoy.holdTime = 0;
      } else {
        // すでにミサイルが飛んでいる場合も、今回の長押しは終了
        rightJoy.missileArmed = true;
      }
    }
  }
}

/* ================================================================
   メインループ
   ================================================================ */
let lastTime = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime = ts;
  let dt = (ts-lastTime)/1000;
  lastTime = ts;
  dt = Math.min(dt, 0.05); // 端末が重いときに一気に進みすぎないよう上限をつける

  if(state==="playing"){
    updatePlayer(dt);
    for(const t of tanks){ if(!t.isPlayer) updateEnemy(t, dt); }
    for(let i=0;i<tanks.length;i++){
      for(let j=i+1;j<tanks.length;j++){
        if(tanks[i].alive && tanks[j].alive) tanksOverlap(tanks[i],tanks[j]);
      }
    }
    updateBullets(dt);
    updateMissiles(dt);
    updateFx(dt);
    tanks = tanks.filter(t=> t.isPlayer || t.alive);

    const enemiesLeft = tanks.filter(t=>!t.isPlayer && t.alive).length;
    updateHud(enemiesLeft);
    if(enemiesLeft===0){
      // 最後の敵を倒した瞬間に状態を固定し、約1秒後にだけクリア画面へ移る。
      state = "stageclear_wait";
      stageClearDelay = 1.0;
    }
  } else if(state==="dying"){
    updateMissiles(dt); // 死亡後もミサイルは動き続ける（誘爆演出のため）
    updateFx(dt);
    respawnTimer -= dt;
    if(respawnTimer<=0){
      if(lives<=0) showGameOver();
      else { respawnPlayer(); state = "playing"; }
    }
  } else if(state==="stageclear_wait"){
    updateFx(dt);
    stageClearDelay -= dt;
    if(stageClearDelay<=0){
      stageClearDelay = 0;
      state = "stageclear";
      showStageClear();
      // ★10ステージ毎のクリア（ライフ回復あり）は専用のファンファーレを鳴らす
      if(stageNum % STAGES_PER_EXTRA_LIFE === 0) playMilestoneClear();
      else playStageClear();
    }
  } else if(state==="stageclear"){
    updateFx(dt);
  }

  render();
}

function respawnPlayer(){
  const lvl = LEVELS[(stageNum-1) % LEVELS.length];
  let sp={x:WORLD_W/2,y:WORLD_H/2};
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(lvl.map[r][c]==="P") sp={x:c*TILE+TILE/2,y:r*TILE+TILE/2};
  player.x=sp.x; player.y=sp.y; player.angle=-Math.PI/2; player.turretAngle=-Math.PI/2;
  player.hp=1; player.alive=true; player.invuln=2.0;
  if(!tanks.includes(player)) tanks.push(player);
}

/* ================================================================
   描画
   ================================================================ */
function render(){
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
  // マップ全体を常時表示。
  const viewW = (canvas.width/dpr) / (scale * CAMERA_ZOOM);
  const viewH = (canvas.height/dpr) / (scale * CAMERA_ZOOM);
  const halfViewW = Math.min(viewW/2, WORLD_W/2);
  const halfViewH = Math.min(viewH/2, WORLD_H/2);
  const cameraX = clamp(player.x, halfViewW, WORLD_W-halfViewW);
  const cameraY = clamp(player.y, halfViewH, WORLD_H-halfViewH);
  ctx.scale(scale * CAMERA_ZOOM, scale * CAMERA_ZOOM);
  ctx.translate(viewW/2 - cameraX, viewH/2 - cameraY);

  // 背景
  ctx.fillStyle = "#ffeef7";
  ctx.fillRect(0,0,WORLD_W,WORLD_H);
  ctx.strokeStyle = "rgba(210,150,220,0.18)";
  ctx.lineWidth = 1;
  for(let x=0;x<=WORLD_W;x+=TILE){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD_H); ctx.stroke(); }
  for(let y=0;y<=WORLD_H;y+=TILE){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD_W,y); ctx.stroke(); }

  // 外周の枠
  ctx.strokeStyle = "#c9baf5";
  ctx.lineWidth = 6;
  ctx.strokeRect(3,3,WORLD_W-6,WORLD_H-6);

  // 壁
  if(walls.length){
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const v = walls[r][c];
        if(v===EMPTY) continue;
        const x=c*TILE, y=r*TILE;
        if(v===BRICK){
          const dmg = bricksHp[r][c];
          const base = dmg>1 ? "#f3b57e" : "#ffd2a3";
          const dark = "#d99a63";
          const inset = 1;
          const bx=x+inset, by=y+inset, bw=TILE-inset*2, bh=TILE-inset*2;

          // 木箱本体
          ctx.fillStyle = base;
          ctx.fillRect(bx,by,bw,bh);

          // 外枠
          ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
          ctx.strokeRect(bx+0.75,by+0.75,bw-1.5,bh-1.5);

          // 板の継ぎ目（上下対称に横線2本）
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(bx, by+bh/3); ctx.lineTo(bx+bw, by+bh/3);
          ctx.moveTo(bx, by+bh*2/3); ctx.lineTo(bx+bw, by+bh*2/3);
          ctx.stroke();

          // 対角の補強材（左右・上下対称なX字）
          ctx.beginPath();
          ctx.moveTo(bx+3, by+3); ctx.lineTo(bx+bw-3, by+bh-3);
          ctx.moveTo(bx+bw-3, by+3); ctx.lineTo(bx+3, by+bh-3);
          ctx.stroke();

          // 四隅の鋲（左右対称に配置）
          ctx.fillStyle = dark;
          const nailOffset = 4, nailR = 1.4;
          const nailPositions = [
            [bx+nailOffset, by+nailOffset],
            [bx+bw-nailOffset, by+nailOffset],
            [bx+nailOffset, by+bh-nailOffset],
            [bx+bw-nailOffset, by+bh-nailOffset],
          ];
          for(const [nx,ny] of nailPositions){
            ctx.beginPath(); ctx.arc(nx,ny,nailR,0,7); ctx.fill();
          }
        } else {
          ctx.fillStyle = "#c9baf5";
          ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
          ctx.fillStyle = "#a898e0";
          ctx.fillRect(x+3,y+3,TILE-6,TILE-6);
          ctx.fillStyle = "#e6dcff";
          ctx.fillRect(x+TILE/2-3,y+TILE/2-3,6,6);
        }
      }
    }
  }

  // ミサイル：小さな円から大きな円へ伸びる着弾予告＋飛翔体
  for(const m of missiles){
    const p=clamp(m.time/MISSILE_FLIGHT_TIME,0,1);
    ctx.save();
    ctx.translate(m.x,m.y);
    ctx.rotate(m.angle);
    ctx.globalAlpha=0.22; ctx.fillStyle="#b3ecff";
    ctx.fillRect(-12,-2,18,4);
    ctx.globalAlpha=1; ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-4,-4); ctx.lineTo(-2,0); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#ffb3d9"; ctx.fillRect(-5,-2,10,4);
    ctx.restore();

    // 着弾地点の予告輪。時間とともに小円→大円へ。
    const rr=3 + p*15;
    ctx.globalAlpha=0.18 + p*0.22; ctx.fillStyle="#ffd166";
    ctx.beginPath(); ctx.arc(m.targetX,m.targetY,rr*0.45,0,7); ctx.fill();
    ctx.globalAlpha=0.65; ctx.strokeStyle="#ff9ecb"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(m.targetX,m.targetY,rr,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // 弾：通常弾と高速弾でデザインを分ける
  for(const b of bullets){
    if(b.fastBullet){
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.globalAlpha=0.28; ctx.fillStyle="#b3ecff";
      ctx.fillRect(-14,-2,20,4);
      ctx.globalAlpha=1; ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-5,-4); ctx.lineTo(-2,0); ctx.lineTo(-5,4); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#8fe0ff"; ctx.fillRect(-5,-2,10,4);
      ctx.restore();
    } else {
      for(let i=0;i<b.trail.length;i++){
        const pt=b.trail[i];
        ctx.globalAlpha = (i+1)/b.trail.length*0.4;
        ctx.fillStyle="#ffd166";
        ctx.beginPath(); ctx.arc(pt.x,pt.y,BULLET_R*0.7,0,7); ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle="#fff0b3";
      ctx.beginPath(); ctx.arc(b.x,b.y,BULLET_R,0,7); ctx.fill();
      ctx.strokeStyle="#c9baf5"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(b.x,b.y,BULLET_R,0,7); ctx.stroke();
    }
  }

  // 自機の砲塔方向と、壁で1回反射した弾道を点線で表示
  drawAimPreview(player);

  // 戦車
  for(const t of tanks){
    if(!t.alive) continue;
    if(t.isPlayer && t.invuln>0 && Math.floor(t.blink*10)%2===0) continue; // 無敵中は点滅させる
    drawTank(t);
  }

  // 破片パーティクル
  for(const p of particles){
    ctx.globalAlpha = clamp(1-p.t/p.life,0,1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // 爆発の輪
  for(const e of explosions){
    const prog = e.t/e.dur;
    const rad = 10 + prog*30*e.scaleF;
    ctx.globalAlpha = 1-prog;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(e.x,e.y,rad*0.6,0,7); ctx.fill();
    ctx.strokeStyle = "#ff8aa8"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(e.x,e.y,rad,0,7); ctx.stroke();
  }
  ctx.globalAlpha=1;

  ctx.restore();
}

function getAimPreviewSegments(t){
  const segments=[];
  let x=t.x + Math.cos(t.turretAngle)*(t.r+6);
  let y=t.y + Math.sin(t.turretAngle)*(t.r+6);
  let angle=t.turretAngle;
  const maxDist=Math.hypot(WORLD_W,WORLD_H)*2;

  for(let bounce=0; bounce<=1; bounce++){
    const dx=Math.cos(angle), dy=Math.sin(angle);
    let hitDist=maxDist, hitX=x+dx*maxDist, hitY=y+dy*maxDist, hitNormal=null;
    const step=2;
    for(let d=0; d<=maxDist; d+=step){
      const px=x+dx*d, py=y+dy*d;
      if(px<=BULLET_R){ hitDist=d; hitX=BULLET_R; hitY=py; hitNormal={x:1,y:0}; break; }
      if(px>=WORLD_W-BULLET_R){ hitDist=d; hitX=WORLD_W-BULLET_R; hitY=py; hitNormal={x:-1,y:0}; break; }
      if(py<=BULLET_R){ hitDist=d; hitX=px; hitY=BULLET_R; hitNormal={x:0,y:1}; break; }
      if(py>=WORLD_H-BULLET_R){ hitDist=d; hitX=px; hitY=WORLD_H-BULLET_R; hitNormal={x:0,y:-1}; break; }
      const col=Math.floor(px/TILE), row=Math.floor(py/TILE);
      if(row>=0&&col>=0&&row<ROWS&&col<COLS&&walls[row][col]!==EMPTY){
        const left=col*TILE, right=left+TILE, top=row*TILE, bottom=top+TILE;
        const dl=Math.abs(px-left), dr=Math.abs(px-right), dt=Math.abs(py-top), db=Math.abs(py-bottom);
        const m=Math.min(dl,dr,dt,db);
        if(m===dl) hitNormal={x:-1,y:0};
        else if(m===dr) hitNormal={x:1,y:0};
        else if(m===dt) hitNormal={x:0,y:-1};
        else hitNormal={x:0,y:1};
        hitDist=d; hitX=px; hitY=py; break;
      }
    }
    segments.push({x1:x,y1:y,x2:hitX,y2:hitY});
    if(!hitNormal || bounce===1) break;
    const vx=Math.cos(angle), vy=Math.sin(angle);
    let rvx=vx, rvy=vy;
    if(hitNormal.x) rvx=-rvx;
    if(hitNormal.y) rvy=-rvy;
    angle=Math.atan2(rvy,rvx);
    x=hitX+rvx*0.5; y=hitY+rvy*0.5;
  }
  return segments;
}

function drawAimPreview(t){
  if(!t.isPlayer || !t.alive) return;
  const segments=getAimPreviewSegments(t);
  ctx.save();
  ctx.setLineDash([4,10]);
  ctx.lineWidth=1.5;
  ctx.strokeStyle="rgba(190,160,230,0.65)";
  ctx.fillStyle="rgba(190,160,230,0.8)";
  for(const s of segments){
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  }
  const last=segments[segments.length-1];
  if(last){
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(last.x2,last.y2,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawTank(t){
  ctx.save();
  ctx.translate(t.x,t.y);

  // 車体
  ctx.save();
  ctx.rotate(t.angle);
  ctx.fillStyle = t.dark;
  ctx.fillRect(-t.r, -t.r*0.95, t.r*2, t.r*1.9);
  ctx.fillStyle = t.color;
  ctx.fillRect(-t.r*0.8, -t.r*0.7, t.r*1.6, t.r*1.4);
  ctx.restore();

  // 砲塔
  ctx.save();
  ctx.rotate(t.turretAngle);
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.arc(0,0,t.r*0.62,0,7); ctx.fill();
  ctx.strokeStyle = t.dark; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle = t.dark;
  ctx.fillRect(0, -3, t.r*1.35, 6);
  ctx.restore();

  // 耐久ゲージ（HPが2以上の敵のみ表示）
  if(!t.isPlayer && t.maxHp>1){
    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.fillRect(-14,-t.r-10,28,4);
    ctx.fillStyle="#ff8aa8";
    ctx.fillRect(-14,-t.r-10,28*(t.hp/t.maxHp),4);
  }

  ctx.restore();
}

/* ================================================================
   HUD（画面上部の文字表示）
   ================================================================ */
const stageLabelEl = document.getElementById("stageLabel");
const scoreLabelEl = document.getElementById("scoreLabel");
const maxStageLabelEl = document.getElementById("maxStageLabel");
const livesEl = document.getElementById("lives");
function formatStageProgress(progress){
  const n = Math.max(1, Number(progress) || 1);
  const lap = Math.floor((n - 1) / 50) + 1;
  const stage = ((n - 1) % 50) + 1;
  return lap === 1 ? `STAGE ${stage}` : `${lap}周目 STAGE ${stage}`;
}

function updateMaxStage(){
  if(totalStageProgress > maxStageProgress){
    maxStageProgress = totalStageProgress;
    localStorage.setItem("tankBattleMaxStageProgress", String(maxStageProgress));
  }
}

function updateHud(enemiesLeft){
  stageLabelEl.textContent = `${formatStageProgress(totalStageProgress)}  残り${enemiesLeft}`;
  maxStageLabelEl.textContent = `MAX ${formatStageProgress(maxStageProgress)}`;
  livesEl.innerHTML = "";
  const safeLives = Math.max(lives,0);
  // ★ハートは最大5個までアイコン表示。6個以上になったらハート1個＋「×数字」で表記する。
  const heartCount = safeLives > MAX_HEART_ICONS ? 1 : safeLives;
  for(let i=0;i<heartCount;i++){
    const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 16 14"); s.setAttribute("class","heart");
    s.innerHTML = '<path d="M8 13 L2 7.5 C0 5.5 0.5 2 3.5 1.5 C5.5 1.2 7 2.3 8 3.8 C9 2.3 10.5 1.2 12.5 1.5 C15.5 2 16 5.5 14 7.5 Z" fill="#ff6f91" stroke="#ffffff" stroke-width="0.8"/>';
    livesEl.appendChild(s);
  }
  if(safeLives > MAX_HEART_ICONS){
    const countEl = document.createElement("span");
    countEl.className = "livesCount";
    countEl.textContent = `×${safeLives}`;
    livesEl.appendChild(countEl);
  }
}
const stageFlashEl = document.getElementById("stageFlash");
let flashTimer=0;
function flashStage(text){
  stageFlashEl.textContent = text;
  stageFlashEl.style.opacity = "1";
  flashTimer = 1.6;
  const iv = setInterval(()=>{
    flashTimer -= 0.05;
    if(flashTimer<=0){ stageFlashEl.style.opacity="0"; clearInterval(iv); }
  }, 50);
}

/* ================================================================
   ステージクリア画面
   ================================================================ */
const stageClearScreen = document.getElementById("stageClearScreen");
const clearStageTitle = document.getElementById("clearStageTitle");
const clearStats = document.getElementById("clearStats");
const nextStageInfo = document.getElementById("nextStageInfo");

const ENEMY_NAMES = {
  yellow:"黄色戦車",
  brown:"茶色戦車",
  green:"緑戦車",
  red:"赤戦車",
  black:"黒戦車"
};

// クリア画面用の戦車アイコン。ゲーム中の戦車と同じ配色・形を使う。
function enemyTankIcon(type){
  const t = ENEMY_TYPES[type] || ENEMY_TYPES.normal;
  const r = 18;
  return `<div class="enemyIconWrap">
    <svg class="enemyTankIcon" viewBox="0 0 72 58" aria-label="${ENEMY_NAMES[type] || type}">
      <g transform="translate(36 29)">
        <rect x="-${r}" y="-${r*0.95}" width="${r*2}" height="${r*1.9}" rx="2" fill="${t.dark}"/>
        <rect x="-${r*0.8}" y="-${r*0.7}" width="${r*1.6}" height="${r*1.4}" rx="2" fill="${t.color}"/>
        <g transform="rotate(-90)">
          <circle cx="0" cy="0" r="${r*0.62}" fill="${t.color}" stroke="${t.dark}" stroke-width="1.5"/>
          <rect x="0" y="-3" width="${r*1.35}" height="6" rx="2" fill="${t.dark}"/>
        </g>
      </g>
    </svg>
    <span class="enemyCount">× {COUNT}</span>
  </div>`.replace('{COUNT}', 'COUNT_PLACEHOLDER');
}

function getNextStageNumber(){
  return stageNum >= 50 ? 1 : stageNum + 1;
}

function getNextLevel(){
  const nextNum = getNextStageNumber();
  return LEVELS[(nextNum - 1) % LEVELS.length];
}

function showStageClear(){
  // ★ステージを10クリアするごとにライフを1回復する。
  const gotExtraLife = (stageNum % STAGES_PER_EXTRA_LIFE === 0);
  if(gotExtraLife){
    lives++;
  }
  const nextNum = getNextStageNumber();
  const next = getNextLevel();
  const counts = {};
  for(const type of (next.enemies || [])){
    counts[type] = (counts[type] || 0) + 1;
  }

  const enemyIcons = Object.entries(counts).map(([type,count]) =>
    enemyTankIcon(type).replace('COUNT_PLACEHOLDER', String(count))
  ).join("");

  clearStageTitle.textContent = `STAGE ${stageNum} CLEAR!`;
  clearStats.innerHTML = `残機：${Math.max(lives,0)}　　スコア：${score}` + (gotExtraLife ? `　　<span style="color:var(--amber);">ライフ+1！</span>` : "");
  nextStageInfo.innerHTML = `次のステージ：<b>STAGE ${nextNum}</b><br><span class="enemyLabel">敵戦車</span><div class="enemyIcons">${enemyIcons || "なし"}</div>`;
  stageClearScreen.classList.remove("hidden");
}

function startNextStage(){
  if(state !== "stageclear") return;
  const nextNum = getNextStageNumber();
  const wasLastStage = (stageNum >= 50);
  stageNum = nextNum;
  if(wasLastStage) lapNum++;
  totalStageProgress++;
  updateMaxStage();
  buildLevel(stageNum - 1);
  state = "playing";
  stageClearDelay = 0;
  gameStartFireLock = 1.0; // 次のステージ開始から1秒間は射撃不可
  stageClearScreen.classList.add("hidden");
}

stageClearScreen.addEventListener("pointerdown", e=>{
  e.preventDefault();
  startNextStage();
});

/* ================================================================
   画面の切り替え（スタート／ポーズ／ゲームオーバー）
   ================================================================ */
const startScreen = document.getElementById("startScreen");
const pauseScreen = document.getElementById("pauseScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const hud = document.getElementById("hud");
const pauseBtn = document.getElementById("pauseBtn");
const bgm = document.getElementById("bgm");
const isIPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  // 端末による体感差を補正。iPhoneではBGMをさらに小さくして効果音を聞き取りやすくする。
  bgm.volume = isIPhone ? 0.025 : (isMobile ? 0.04 : 0.0833); // ゲーム効果音を邪魔しない控えめな音量

function playBgm(){
  bgm.play().catch(()=>{});
}
function stopBgm(){
  bgm.pause();
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("resumeBtn").addEventListener("click", ()=>{
  pauseScreen.classList.add("hidden"); state="playing";
  playBgm();
});
document.getElementById("restartFromPauseBtn").addEventListener("click", startGame);
document.getElementById("retryBtn").addEventListener("click", startGame);
pauseBtn.addEventListener("click", ()=>{
  if(state==="playing"){
    state="paused";
    stopBgm();
    pauseScreen.classList.remove("hidden");
  }
});

function startGame(){
  initAudio();
  bgm.currentTime = 0;
  playBgm();
  stageNum = 1; lapNum = 1; totalStageProgress = 1;
  score = 0; lives = 3; // ★初期ライフ数
  updateMaxStage();
  buildLevel(0);
  stageClearDelay = 0;
  gameStartFireLock = 1.0; // ゲーム開始から1秒間は射撃不可
  state = "playing";
  startScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");
  stageClearScreen.classList.add("hidden");
  hud.classList.remove("hidden");
}
function showGameOver(){
  state = "gameover";
  stopBgm();
  document.getElementById("finalStage").textContent = formatStageProgress(totalStageProgress);
  document.getElementById("finalMaxStage").textContent = formatStageProgress(maxStageProgress);
  document.getElementById("finalScore").textContent = `${score}`;
  gameOverScreen.classList.remove("hidden");
  stageClearScreen.classList.add("hidden");
  hud.classList.add("hidden");
}

requestAnimationFrame(loop);
})();
</script>
